services:
  - type: web
    name: aqualynk_backend
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn aqualynk.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aqualynk-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: aqualynk-db
    plan: free
    databaseName: aqualynk
    user: aqualynk